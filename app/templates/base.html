<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}StudyHub{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">StudyHub</a>
    {% if current_user.is_authenticated %}
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
      <a class="nav-link" href="{{ url_for('main.courses') }}">Courses</a>
      <a class="nav-link" href="{{ url_for('main.tasks') }}">Tasks</a>
      <a class="nav-link" href="{{ url_for('main.timer') }}">Study Timer</a>
    </div>
    <span class="navbar-text me-3">{{ current_user.name }}</span>
    <form method="post" action="{{ url_for('auth.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn btn-sm btn-light">Logout</button>
    </form>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
